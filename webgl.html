<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%;position:absolute;inset:0}#fallback{z-index:0}#scene{z-index:1}</style></head><body><canvas id="fallback" aria-hidden="true"></canvas><canvas id="scene" aria-label="Abstract interactive portfolio scene"></canvas><script>
(()=>{const c=document.querySelector('#fallback'),x=c.getContext('2d');let w,h,t=0,mx=0,my=0;function size(){w=c.width=innerWidth*devicePixelRatio;h=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=innerWidth;h=innerHeight}addEventListener('resize',size);addEventListener('pointermove',e=>{mx=(e.clientX/w-.5)*25;my=(e.clientY/h-.5)*20});size();function draw(){requestAnimationFrame(draw);t+=.006;x.clearRect(0,0,w,h);x.save();x.translate(w/2+mx,h/2+my);for(let i=0;i<9;i++){x.save();x.rotate(t*(i%2?1:-1)*.15+i*.34);x.beginPath();x.ellipse(0,0,Math.min(w,h)*(.16+i*.012),Math.min(w,h)*(.08+i*.024),.3,0,Math.PI*2);x.strokeStyle=i===3?'rgba(235,23,22,.65)':'rgba(220,218,208,.24)';x.lineWidth=i===3?1.4:.7;x.stroke();x.restore()}let g=x.createRadialGradient(0,0,0,0,0,Math.min(w,h)*.22);g.addColorStop(0,'rgba(235,23,22,.1)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(-w,-h,w*2,h*2);x.restore()}draw()})();
</script><script type="module" src="js/scene.js"></script></body></html>
